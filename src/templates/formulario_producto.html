{% extends 'layout.html' %}
    

{% block contenido %}
<div class="container mt-4">
<h2 style="text-align: center;"> {{ titulo }} </h2>   
<form action="/formulario_producto" method="post">
    <div class="form-row">
      <div class="form-group col-md-6">
        <label for="codigo">Código</label>
        <input type="text" class="form-control" id="codigo" name="codigo" placeholder="AAA00000" onblur="validarcodigo()">
        <span class="alert alert-danger" role="alert" id="errorCodigo" style="display: none;">Error, el campo debe tener 3 letras mayúsculas y número </span>
      </div> 
      <div class="form-group col-md-6">
        <label for="descripcion">Descripción</label>
        <input type="text" class="form-control" id="descripcion" name="descripcion" placeholder="Describa el producto (dato único)">
      </div>
      <div class="form-group col-md-6">
        <label for="cantidad_inventario">Cantidad Inventario</label>
        <input type="number" class="form-control" id="cantidad_inventario" name="cantidad_inventario">
      </div>
      <div class="form-group col-md-6">
        <label for="valor_unitario">Valor unitario</label>
            <div class="input-group">
              <div class="input-group-prepend">
                <span class="input-group-text">$</span>
            </div>
            <input type="number" class="form-control" id="valor_unitario" name="valor_unitario">
          </div>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group col-md-6">
        <label for="unidad_medida">Unidad de Medida</label>
        <select id="unidad_medida" class="form-control" name="unidad_medida">
          <option selected>Por favor seleccione...</option>
          <option value="GRS">GRS</option>
          <option value="UND">UND</option>
        </select>
      </div>
      <div class="form-group col-md-6">
        <label for="categoria">Categoria</label>
        <select id="categoria" class="form-control" name="categoria">
          <option selected>Por favor seleccione...</option>
          {% for categoria in categorias %}
          <option value="{{categoria.id}}">{{categoria.nombre_categoria}}</option>
          {% endfor %}
        </select>
      </div>
    </div>
    <button type="submit" class="btn btn-primary">Guardar</button>
  </form>
</div>
  <script type="text/javascript">
    function validarcodigo() {
      console.log("Entro a la función");
      let campoCodigo = document.getElementById("codigo");
      let valorCodigo = campoCodigo.value;
      let errorCodigo = document.getElementById("errorCodigo");
      console.log("El valor del código escrito es:" + valorCodigo);
      var expresionRegular = new RegExp("[A-Z]{3}[0-9]{1,}")
      if (expresionRegular.test(valorCodigo)) {
        console.log("El campo cumple la validación");
        errorCodigo.style.display = 'none';

      } else {
        console.log("El campo  NO cumple la validación");
        errorCodigo.style.display = 'block'; 
      }
    } 
  </script>  
{% endblock contenido %}
