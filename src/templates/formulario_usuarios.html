{% extends 'layout.html' %}
    

{% block contenido %}
<h2> {{ titulo }} </h2>   
<form>
    <div class="form-row">
        <div class="form-group col-md-4">
          <label for="tipo_ususario">Tipo de usuario</label>
          <select id="tipo_ususario" class="form-control">
            <option selected>Por favor seleccione...</option>
            <option value="administrador">Administrador</option>
            <option value="cliente">Cliente</option>
          </select>
        </div>
      </div>
    <div class="form-row">
      <div class="form-group col-md-6">
        <label for="nombre">Nombre</label>
        <input type="text" class="form-control" id="nombre" placeholder="Nombre completo del usuario">
      </div>
      <div class="form-group col-md-6">
        <label for="id_usuario">ID Usuario</label>
        <input type="number" class="form-control" id="id_usuario">
      </div>
      <div class="form-group col-md-6">
        <label for="contrasena">Contraseña</label>
        <input type="password" class="form-control" id="contrasena">
      </div>
    </div>

    <button type="submit" class="btn btn-primary">Guardar</button>
  </form>  
{% endblock contenido %}
